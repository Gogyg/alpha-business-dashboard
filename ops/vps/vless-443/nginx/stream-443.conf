map $ssl_preread_server_name $tls_backend {
    www.bing.com xray_reality;
    default alfanib_https;
}

upstream xray_reality {
    server 127.0.0.1:2087;
}

upstream alfanib_https {
    server 127.0.0.1:10443;
}

server {
    listen 443;
    proxy_pass $tls_backend;
    proxy_protocol on;
    ssl_preread on;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
}
