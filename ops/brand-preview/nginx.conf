server {
    listen 80;
    server_name alpha-dashboard.152-234-236-200.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://alpha-dashboard.152-234-236-200.sslip.io$request_uri;
    }
}

server {
    listen 127.0.0.1:10443 ssl proxy_protocol;
    server_name alpha-dashboard.152-234-236-200.sslip.io;

    ssl_certificate /etc/letsencrypt-alpha-ip/live/alpha-dashboard.152-234-236-200.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-alpha-ip/live/alpha-dashboard.152-234-236-200.sslip.io/privkey.pem;

    root /var/www/alpha-brand-preview;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        try_files /index.html =404;
    }

    location = /living-dashboard {
        try_files /index.html =404;
    }

    location = /living-dashboard/ {
        try_files /index.html =404;
    }

    location = /app-icon.png {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
